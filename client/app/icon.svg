<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Territorio: contorno geométrico abstracto de una región -->
  <path d="M12 20 L26 10 L44 14 L54 28 L48 46 L30 54 L14 44 Z"
        fill="#2563eb" fill-opacity="0.10"
        stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Aristas del grafo (red de nodos conectados) -->
  <g stroke="#16a34a" stroke-width="2.2" stroke-linecap="round">
    <line x1="24" y1="24" x2="40" y2="20"/>
    <line x1="24" y1="24" x2="30" y2="40"/>
    <line x1="40" y1="20" x2="44" y2="38"/>
    <line x1="30" y1="40" x2="44" y2="38"/>
    <line x1="24" y1="24" x2="44" y2="38"/>
  </g>
  <!-- Nodos -->
  <g fill="#16a34a">
    <circle cx="24" cy="24" r="4.5"/>
    <circle cx="40" cy="20" r="4.5"/>
    <circle cx="30" cy="40" r="4.5"/>
    <circle cx="44" cy="38" r="4.5"/>
  </g>
  <circle cx="24" cy="24" r="2" fill="#ffffff"/>
  <circle cx="40" cy="20" r="2" fill="#ffffff"/>
  <circle cx="30" cy="40" r="2" fill="#ffffff"/>
  <circle cx="44" cy="38" r="2" fill="#ffffff"/>
</svg>
